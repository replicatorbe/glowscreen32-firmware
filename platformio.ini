; ESP32-2432S028 "Cheap Yellow Display" (CYD)
; Deux environnements : CYD original (1 port micro-USB, ILI9341)
; et CYD2USB (micro-USB + USB-C, contrôleur ST7789).
; On flashera d'abord l'env correspondant à la carte identifiée au branchement.

[platformio]
default_envs = cyd
src_dir = src

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Le pilote Apple CH34x devient instable au-dela de 460800 bauds.
upload_speed = 460800
board_build.partitions = min_spiffs.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
; XPT2046_Bitbang_Slim a ete retire : il etait declare ici mais inclus par
; AUCUN fichier de src/. Il ne redeviendra utile que si la carte SD doit
; cohabiter avec le tactile sur VSPI (voir cyd_pins.h).

; src/tools/ contient des outils autonomes (leur propre setup/loop) : ils sont
; exclus du firmware et compiles dans leur propre environnement.
build_src_filter = +<*> -<tools/>

; Configuration TFT_eSPI passée en build flags : pas besoin de patcher
; User_Setup.h dans le dossier de la librairie.
build_flags =
    -DUSER_SETUP_LOADED=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
; Polices : depuis la v2.0 l'interface utilise des polices VLW lissees et
; accentuees (src/ui/fonts/), chargees par tft.loadFont(). Les polices bitmap
; 6, 7 et 8 etaient compilees sans jamais etre utilisees -- 6,3 ko de flash
; pour rien. GLCD, 2 et 4 restent pour l'outil de calibration et les replis.
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
; SMOOTH_FONT etait DEJA actif : les VLW n'ont demande aucun changement de
; build, contrairement a ce que laissait entendre docs/firmware.md.
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
; Pas de -DSPI_TOUCH_FREQUENCY : ce reglage ne concerne que le pilote tactile
; interne de TFT_eSPI, que nous n'utilisons pas. XPT2046_Touchscreen fixe
; 2 MHz en dur dans sa propre SPISettings -- le flag n'avait aucun effet.
    -DUSE_HSPI_PORT

; --- CYD original : un seul port micro-USB, driver ILI9341 alternatif ---
;
; ⚠️ TFT_INVERSION_ON : CONSTATE SUR LA CARTE, PAS DEDUIT.
; La sequence d'init de ILI9341_2_DRIVER n'emet NI 0x20 (INVOFF) NI 0x21
; (INVON) : la dalle reste dans son etat par defaut. Sur cet exemplaire, cet
; etat affiche tout en negatif -- un fond noir sort blanc, un texte blanc sort
; noir. Le defaut etait present des la v1.4 (fond TFT_BLACK affiche blanc) sans
; qu'on l'identifie : avec une interface presque monochrome, un negatif reste
; lisible et passe pour un choix de style. Il n'a saute aux yeux qu'avec des
; tuiles colorees, quand du violet #9B59B6 est sorti vert olive.
[env:cyd]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER=1
    -DTFT_INVERSION_ON=1

; --- CYD 2 USB (micro-USB + USB-C) : dalle pilotée en ST7789, ordre BGR ---
[env:cyd2usb]
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF

; Repli si l'upload à 460800 bauds échoue (câble/alim médiocres)
[env:cyd_slow]
extends = env:cyd
upload_speed = 115200

; --- Outil de calibration du tactile (src/tools/touch_calib.cpp) ---
; Firmware autonome : affiche quatre cibles et imprime les bornes brutes
; XPT2046 à recopier dans src/ui/touch_calib.h.
;     pio run -e calib -t upload && pio device monitor -e calib
[env:calib]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER=1
    -DTFT_INVERSION_ON=1
build_src_filter = -<*> +<tools/touch_calib.cpp>
